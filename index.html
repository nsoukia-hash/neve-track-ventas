<title>Compras internacionales — Stock NEVE</title>
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1d212a; --line:#282d38;
  --txt:#e6e9ef; --dim:#98a0b0; --dim2:#6d7686;
  --ok:#2ea043; --okbg:#0f2b17; --warn:#d29922; --warnbg:#2e2409;
  --red:#f85149; --redbg:#33100f; --blue:#388bfd; --bluebg:#0d2240;
  --purple:#a371f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 80px}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
h2{font-size:16px;margin:30px 0 12px;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
h2 .cnt{background:var(--card2);border:1px solid var(--line);color:var(--dim);font-size:11px;font-weight:600;padding:1px 8px;border-radius:20px}

/* barra de guardado */
#savebar{display:none;position:sticky;top:0;z-index:50;background:var(--warnbg);border:1px solid var(--warn);
  border-radius:10px;padding:11px 13px;margin-bottom:16px;align-items:center;gap:10px;flex-wrap:wrap}
#savebar.on{display:flex}
#savebar .msg{flex:1;min-width:190px;font-size:13px;color:#f0cf7a}
#savebar button{background:var(--warn);color:#191100;border:0;border-radius:7px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
#savebar button.ghost{background:transparent;color:#f0cf7a;border:1px solid var(--warn)}
#csvout{display:none;width:100%;height:150px;margin-top:9px;background:#0b0d11;color:var(--txt);
  border:1px solid var(--line);border-radius:7px;padding:9px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-.5px}
.stat .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.stat.alert{border-color:var(--red);background:var(--redbg)} .stat.alert .n{color:var(--red)}
.stat.clean{border-color:var(--ok);background:var(--okbg)} .stat.clean .n{color:var(--ok)}

/* demorados */
.dem{border-radius:11px;padding:13px 15px;margin-bottom:10px;border:1px solid}
.dem.rojo{background:var(--redbg);border-color:var(--red)}
.dem.amar{background:var(--warnbg);border-color:var(--warn)}
.dem.verde{background:var(--okbg);border-color:var(--ok);color:#7ee2a0}
.dem .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:3px}
.dem .days{font-weight:700;font-size:14px}
.dem.rojo .days{color:var(--red)} .dem.amar .days{color:var(--warn)}
.dem .prod{font-weight:600}
.dem .who{color:var(--dim);font-size:13px}
.dem .why{font-size:13px;color:#c6cddb;margin-top:5px}
.dem .why b{color:var(--txt)}

/* grupos */
.grp{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden}
.grp>summary,.grp .head{padding:12px 15px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;cursor:default}
.grp>summary{cursor:pointer;list-style:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"▸";color:var(--dim2);font-size:12px;transition:transform .15s}
.grp[open]>summary::before{transform:rotate(90deg)}
.cli{font-weight:600}
.nro{background:var(--bluebg);color:#79b8ff;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600}
.nro.none{background:var(--card2);color:var(--dim2)}
.meta{margin-left:auto;color:var(--dim2);font-size:12px}
.item{padding:11px 15px 14px;border-top:1px solid var(--line)}
.item .prod{font-weight:500;margin-bottom:3px}
.item .prov{font-size:12px;color:var(--dim);margin-bottom:9px}
.item .prov a{color:var(--blue);text-decoration:none}
.item .nota{font-size:12px;color:var(--dim);background:var(--card2);border-left:2px solid var(--line);
  padding:6px 9px;border-radius:0 6px 6px 0;margin-top:9px}

/* pipeline */
.pipe{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);
  background:var(--card2);color:var(--dim2);white-space:nowrap}
.chip.done{background:var(--okbg);border-color:#1f6f33;color:#7ee2a0}
.chip.now{background:var(--bluebg);border-color:#1f5ea8;color:#79b8ff;font-weight:600}
.chip.late{background:var(--redbg);border-color:#8b2b28;color:#ff8a83;font-weight:600}
.chip.man{cursor:pointer;border-style:dashed}
.chip.man:hover{border-color:var(--purple);color:#c9a6ff}
.chip.man.done{border-style:solid}
.chip.dirty{box-shadow:0 0 0 2px rgba(163,113,247,.45)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
tr:last-child td{border-bottom:0}
details.arch{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
details.arch>summary{padding:13px 15px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
details.arch>summary::-webkit-details-marker{display:none}
details.arch>summary::before{content:"▸ ";color:var(--dim2)}
details.arch[open]>summary::before{content:"▾ "}
details.arch .inner{border-top:1px solid var(--line);overflow-x:auto}
.avisos li{margin-bottom:9px;font-size:13.5px;color:#c6cddb}
.avisos li b{color:var(--txt)}
.empty{background:var(--okbg);border:1px solid var(--ok);color:#7ee2a0;border-radius:11px;padding:13px 15px;font-size:13.5px}
footer{margin-top:34px;color:var(--dim2);font-size:11.5px;border-top:1px solid var(--line);padding-top:13px}
</style>
</head>

const baseLevel = id => { const r = csvMap[id]; if(!r) return 0;
  if(r[6]==='SI') return 3; if(r[4]==='SI') return 2; if(r[3]==='SI') return 1; return 0; };
const level = id => (id in overrides) ? overrides[id] : baseLevel(id);

const ESTADO_RANK = {pedido_confirmado:0,pagado:1,enviado_warehouse:2,arribado_warehouse:3,en_vuelo:4,deberia_haber_llegado_ar:5};

function itemArchivado(env,it){
  if(it.venta && it.venta.estado_venta === 'Enviado') return true;
  return level(it.item_id) >= 3;
}
const dias = (a,b) => Math.floor((new Date(b) - new Date(a)) / 86400000);

/* ---------- DEMORADOS ---------- */
function calcDemorados(){
  const out = [];
  ENVIOS.forEach(env => env.items.forEach(it => {
    const arch = itemArchivado(env,it);
    if(env.perdido){
      const esp = new Date(env.enviado_warehouse); esp.setDate(esp.getDate()+5);
      out.push({d:dias(esp,HOY),prod:it.producto,
        who: it.venta ? (it.venta.cliente+' · venta '+it.venta.nro_interno) : 'Reposición de stock',
        src: env.proveedor+' · orden '+env.orden,
        why:'<b>Paquete perdido.</b> Sin ningún evento de tracking desde el despacho del 20/8. Reclamo USPS abierto el 9/9 ('+env.search_id+'). La venta ya se resolvió con stock, pero hay que <b>reclamarle el reembolso a Jomashop</b> con el Search ID.'});
      return;
    }
    if(arch) return;
    const st = env.estado_auto; let esp = null, why = '';
    if(st==='pedido_confirmado' || st==='pagado'){
      esp = env.eta_proveedor ? new Date(env.eta_proveedor.split(' ')[0]) : (()=>{const x=new Date(env.fecha_compra);x.setDate(x.getDate()+5);return x;})();
      why = 'Pagado pero el proveedor todavía no lo despachó. <b>Escribirle al vendedor</b> y pedir tracking.';
    } else if(st==='enviado_warehouse' && !env.arribo_warehouse){
      esp = new Date(env.enviado_warehouse); esp.setDate(esp.getDate()+5);
      why = 'Despachado hace más de 5 días y todavía sin confirmación de entrega en el warehouse. <b>Revisar el tracking</b> y, si sigue frenado, abrir reclamo al courier.';
    } else if(st==='deberia_haber_llegado_ar' && level(it.item_id) < 1){
      esp = new Date(env.vuelo_llegada_estimada);
      why = 'Ya pasó la fecha estimada de llegada a Argentina y no está marcado como recibido. <b>Chequear con el consolidador</b> o marcarlo llegado con el chip de abajo.';
    } else return;
    const d = dias(esp,HOY);
    if(d >= 5) out.push({d,prod:it.producto,
      who: it.venta ? (it.venta.cliente+' · venta '+it.venta.nro_interno) : 'Reposición de stock',
      src: env.proveedor+' · orden '+env.orden, why});
  }));

  EXTERNAS.filter(e => e.recibido !== 'SI').forEach(e => {
    const d = dias(e.fecha_venta,HOY); if(d < 5) return;
    const quien = e.via.split(' ')[0];
    const why = e.comprado === 'NO'
      ? 'Venta fuera de Gmail: <b>todavía no se lo encargó a '+quien+'</b>.'
      : (d >= 10 ? '<b>Preguntarle a '+quien+'</b> cómo viene — ya pasaron '+d+' días desde la venta.'
                 : 'Encargado a '+quien+', todavía sin recibir. Conviene ir preguntando.');
    out.push({d,prod:e.producto,who:e.cliente+' · venta '+e.nro_interno,src:'Compra en mano · '+e.via,why,ext:e.producto});
  });

  SIN_COMPRA.forEach(v => { const d = dias(v.fecha_venta,HOY); if(d < 5) return;
    out.push({d,prod:v.producto,who:v.cliente+' · venta '+v.nro_interno,src:'Sin compra identificada',
      why:'Venta cobrada hace '+d+' días y <b>todavía no se compró</b>. Comprarla o marcarla como compra externa.'}); });

  // agrupar productos repetidos de Meli
  const porProd = {};
  out.forEach(o => { if(o.ext){ porProd[o.ext] = (porProd[o.ext]||0)+1; } });
  out.forEach(o => { if(o.ext && porProd[o.ext] > 1) o.why += ' Hay <b>'+porProd[o.ext]+' ventas del mismo producto</b> pendientes — preguntale por todas juntas.'; });

  return out.sort((a,b) => b.d - a.d);
}

/* ---------- render ---------- */
function chips(env,it){
  const st = env.estado_auto, rank = ESTADO_RANK[st] ?? 0, lv = level(it.item_id);
  const forzado = it.venta && it.venta.estado_venta === 'Enviado';
  const auto = [
    ['Pedido confirmado',0],['Pagado',1],['Enviado a warehouse',2],
    ['Arribado a Miami',3],['En vuelo',4]
  ];
  let h = '';
  auto.forEach(([txt,r]) => {
    let c = 'chip';
    if(forzado || rank > r) c += ' done'; else if(rank === r) c += ' now';
    h += '<span class="'+c+'">'+txt+'</span>';
  });
  const llegoTxt = (rank >= 5 && lv < 1 && !forzado)
    ? 'Debería haber llegado a AR ('+FMT(env.vuelo_llegada_estimada)+')'
    : 'Llegó a Argentina';
  const man = [[llegoTxt,1],['Empaquetado',2],['Enviado al cliente',3]];
  man.forEach(([txt,l]) => {
    let c = 'chip man';
    const efec = forzado ? 3 : lv;
    if(efec >= l) c += ' done';
    else if(l === 1 && rank >= 5) c += ' late';
    if((it.item_id in overrides)) c += ' dirty';
    h += '<span class="'+c+'" data-lv="'+l+'" data-origtext="'+txt.replace(/"/g,'&quot;')+'" onclick="clickChip(\''+it.item_id+'\','+l+')">'+txt+'</span>';
  });
  return '<div class="pipe">'+h+'</div>';
}

function clickChip(itemId, lv){
  const cur = level(itemId);
  const nuevo = (cur === lv) ? lv - 1 : lv;
  if(nuevo === baseLevel(itemId)) delete overrides[itemId]; else overrides[itemId] = nuevo;
  localStorage.setItem(MANKEY, JSON.stringify(overrides));
  render();
}

function buildCsv(){
  const lines = [CSV_HEADER];
  CSV_ROWS.forEach(r => {
    const row = r.slice();
    const lv = level(r[0]);
    row[3] = lv >= 1 ? 'SI' : 'NO';
    row[4] = lv >= 2 ? 'SI' : 'NO';
    row[6] = lv >= 3 ? 'SI' : 'NO';
    lines.push(row.map(c => /[",\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c).join(','));
  });
  return lines.join('\n');
}
function copyCsv(){
  const csv = buildCsv();
  const ta = document.getElementById('csvout');
  ta.style.display = 'block'; ta.value = csv; ta.select();
  if(navigator.clipboard) navigator.clipboard.writeText(csv).catch(()=>{});
  else { try{ document.execCommand('copy'); }catch(e){} }
}
function discard(){ overrides = {}; localStorage.removeItem(MANKEY); document.getElementById('csvout').style.display='none'; render(); }

function grupos(archivados){
  const g = {};
  ENVIOS.forEach(env => env.items.forEach(it => {
    if(itemArchivado(env,it) !== archivados) return;
    const man = csvMap[it.item_id];
    const key = (man && man[1]) ? man[1] : (it.venta ? it.venta.cliente : 'Reposición de stock');
    (g[key] = g[key] || {cliente:key,items:[],fecha:'0000-00-00',nro:it.venta?it.venta.nro_interno:null}).items.push({env,it});
    if(env.fecha_compra > g[key].fecha) g[key].fecha = env.fecha_compra;
  }));
  return Object.values(g).sort((a,b) => b.fecha.localeCompare(a.fecha));
}

function itemHtml(env,it){
  let h = '<div class="item" data-item="'+it.item_id+'">';
  h += '<div class="prod">'+it.producto+'</div>';
  h += '<div class="prov">'+env.proveedor+' · orden '+env.orden+(env.tracking?' · '+env.tracking:'')
     + ' · comprado '+(env.fecha_compra?FMT(env.fecha_compra):'—')
     + ' · <a href="'+env.mail_link+'" target="_blank">ver mail</a></div>';
  h += chips(env,it);
  const notas = [env.nota, it.venta && it.venta.nota].filter(Boolean);
  if(notas.length) h += '<div class="nota">'+notas.join('<br>')+'</div>';
  return h + '</div>';
}

function render(){
  try { overrides = JSON.parse(localStorage.getItem(MANKEY) || '{}'); } catch(e){}

  document.getElementById('stamp').textContent =
    'Actualizado el sábado 12/09/2026 · ventas NEVE #225 en adelante · publicado sin el entorno Linux (Paso 7-bis)';

  const dem = calcDemorados();
  const act = grupos(false), arch = grupos(true);
  const nItems = act.reduce((s,g)=>s+g.items.length,0);
  const enVuelo = ENVIOS.filter(e => e.items.some(i=>!itemArchivado(e,i)) && ['arribado_warehouse','en_vuelo'].includes(e.estado_auto)).length;
  const enAR = ENVIOS.filter(e => e.items.some(i=>!itemArchivado(e,i)) && e.estado_auto==='deberia_haber_llegado_ar').length;

  document.getElementById('stats').innerHTML = [
    '<div class="stat '+(dem.length?'alert':'clean')+'"><div class="n">'+dem.length+'</div><div class="l">Demorados</div></div>',
    '<div class="stat"><div class="n">'+nItems+'</div><div class="l">Items en curso</div></div>',
    '<div class="stat"><div class="n">'+enAR+'</div><div class="l">Ya en Argentina</div></div>',
    '<div class="stat"><div class="n">'+enVuelo+'</div><div class="l">En Miami / vuelo</div></div>',
    '<div class="stat"><div class="n">'+EXTERNAS.filter(e=>e.recibido!=='SI').length+'</div><div class="l">Compras en mano</div></div>',
    '<div class="stat"><div class="n">'+SIN_COMPRA.length+'</div><div class="l">Sin comprar</div></div>'
  ].join('');

  document.getElementById('demorados').innerHTML = dem.length
    ? dem.map(d => '<div class="dem '+(d.d>=10?'rojo':'amar')+'">'
        + '<div class="top"><span class="days">'+d.d+' días de atraso</span><span class="prod">'+d.prod+'</span>'
        + '<span class="who">'+d.who+'</span></div>'
        + '<div class="who">'+d.src+'</div><div class="why">'+d.why+'</div></div>').join('')
    : '<div class="dem verde">✓ Nada demorado. Chequeado el 12/09/2026 contra tránsito internacional, compras en mano y ventas sin comprar.</div>';

  document.getElementById('cnt-curso').textContent = nItems+' items';
  document.getElementById('curso').innerHTML = act.map(g => {
    const multi = g.items.length > 1;
    const head = '<span class="cli">'+g.cliente+'</span>'
      + (g.items[0].it.venta ? '<span class="nro">venta '+g.items[0].it.venta.nro_interno+'</span>' : '<span class="nro none">sin venta</span>')
      + '<span class="meta">'+g.items.length+' producto'+(multi?'s':'')+' · '+FMT(g.fecha)+'</span>';
    const body = g.items.map(x => itemHtml(x.env,x.it)).join('');
    return multi
      ? '<details class="grp" open><summary>'+head+'</summary>'+body+'</details>'
      : '<div class="grp"><div class="head">'+head+'</div>'+body+'</div>';
  }).join('');

  document.getElementById('cnt-sin').textContent = SIN_COMPRA.length;
  document.getElementById('sincompra').innerHTML = SIN_COMPRA.length
    ? '<div class="grp"><div class="inner"><table><thead><tr><th>Venta</th><th>Cliente</th><th>Producto</th><th>Fecha</th></tr></thead><tbody>'
      + SIN_COMPRA.map(v=>'<tr><td>'+v.nro_interno+'</td><td>'+v.cliente+'</td><td>'+v.producto+'</td><td>'+FMT(v.fecha_venta)+'</td></tr>').join('')
      + '</tbody></table></div></div>'
    : '<div class="empty">✓ Todas las ventas #225+ que figuran Pedido/Comprado tienen su compra identificada en Gmail o su fila en compras en mano.</div>';

  const ext = EXTERNAS.filter(e=>e.recibido!=='SI');
  document.getElementById('cnt-ext').textContent = ext.length;
  document.getElementById('externas').innerHTML =
    '<div class="grp"><div class="inner"><table><thead><tr><th>Venta</th><th>Cliente</th><th>Producto</th><th>Vendida</th><th>Vía</th><th>Encargado</th><th>Recibido</th></tr></thead><tbody>'
    + EXTERNAS.map(e=>'<tr><td>'+e.nro_interno+'</td><td>'+e.cliente+'</td><td>'+e.producto+'</td><td>'+FMT(e.fecha_venta)+'</td><td>'+e.via+'</td><td>'+e.comprado+'</td><td>'+e.recibido+'</td></tr>').join('')
    + '</tbody></table></div></div>';

  document.getElementById('avisos').innerHTML = AVISOS.map(a=>'<li>'+a+'</li>').join('');

  const archItems = arch.reduce((s,g)=>s+g.items.length,0);
  document.getElementById('cnt-arch').textContent = archItems+' items';
  const tb = document.querySelector('#archtable tbody');
  tb.innerHTML = arch.flatMap(g => g.items.map(x =>
    '<tr><td>'+g.cliente+'</td><td>'+(x.it.venta?x.it.venta.nro_interno:'—')+'</td><td>'+x.it.producto+'</td>'
    +'<td>'+x.env.proveedor+'</td><td>'+(x.env.fecha_compra?FMT(x.env.fecha_compra):'—')+'</td>'
    +'<td>'+(x.it.venta && x.it.venta.estado_venta==='Enviado' ? 'Enviado al cliente' : 'Cerrado a mano')+'</td></tr>')).join('');

  const n = Object.keys(overrides).length;
  const bar = document.getElementById('savebar');
  if(n){ bar.classList.add('on');
    document.getElementById('savemsg').innerHTML = '<b>'+n+'</b> cambio'+(n>1?'s':'')+' sin guardar. Copiá el CSV y pegalo en GitHub para que la próxima corrida los tome.'; }
  else { bar.classList.remove('on'); document.getElementById('csvout').style.display='none'; }

  document.getElementById('foot').textContent =
    'Regla de consolidación: lo que llega al warehouse de Miami (1340 NW 114th St, FL 33167) antes del lunes 14:00 sube al vuelo del martes y aterriza en Argentina el jueves ~23:00. '
    + 'Umbral de demora: ≥5 días amarillo, ≥10 días rojo. Fuente: Gmail + NEVE_Lista_de_Ventas.xlsx.';
}
render();
</script>
